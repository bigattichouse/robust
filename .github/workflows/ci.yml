# CI — build + full test discipline (see SECURITY.md).
# Every push/PR gets: -Werror build of the umbrella + taguchi, all C suites
# under valgrind, the same suites again under ASan/UBSan, the parser fuzz, and
# the literature-validation suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # Before the test steps, not after: `make test-all` and `make test-asan`
      # run the binding contract tests too, and skip them when pytest is
      # missing. Installing first means those stages actually cover the
      # binding -- the ASan one in particular runs it against the sanitized
      # binary, which is where a path assumption in these tests surfaced.
      - name: Install the binding's test dependencies
        # The dependencies only, NOT the package: installing taguchi-bindings
        # would put a copy in site-packages that could shadow the source tree,
        # and testing a stale copy of the thing you just changed is the exact
        # trap the default-goal and stale-binary fixes exist for. The set is
        # declared in the binding's pyproject.toml [test] extra; keep in sync.
        run: python3 -m pip install --quiet pytest pytest-asyncio

      - name: Build (libdoe + morris/sobol/robust/pareto + taguchi)
        run: make all

      # A bare `make` has to build the tree once .d files exist.
      #
      # It did not, from 2026-08-06 to 2026-08-10: `-include $(DEPFILES)` sat
      # above `all:`, so after the first build the default goal came from a .d
      # file and `make` rebuilt one current object and reported success. Users
      # got silently stale binaries on every incremental build; one spent a
      # while concluding a shipped feature "wasn't implemented" against a
      # day-old binary.
      #
      # CI could not have caught it, because every step above names a goal —
      # which is exactly why this step does not. It reproduces the real
      # sequence: build, touch a source, bare `make`, and require the binary
      # to have actually moved.
      - name: A bare `make` builds the tree (default-goal regression)
        run: |
          make check-default-goal
          before=$(stat -c %Y build/bin/morris)
          touch screen/morris/src/cli/main.c
          make
          after=$(stat -c %Y build/bin/morris)
          if [ "$after" -le "$before" ]; then
            echo "::error::a bare 'make' did not rebuild a stale binary"
            exit 1
          fi
          echo "bare make rebuilt morris: $before -> $after"

      # `make test` fails the build if ANY suite leaks. That was not true
      # before 2026-08-06: the valgrind stage was a `cmd; cmd; cmd` sequence,
      # so only the last suite's status reached make and all output went to
      # /dev/null. See the comment on the `test` target.
      - name: Test (all C suites + valgrind, incl. taguchi)
        run: make test-all

      - name: Test the Python binding contract
        run: make test-bindings

      - name: Test under ASan/UBSan
        run: make test-asan

      - name: Fuzz parsers under ASan/UBSan
        run: make fuzz

      # Pins the published results the roadmap rests on against closed-form
      # ground truth (validation/README.md). Without this, a change to the
      # morris or sobol math could silently invalidate the claims in
      # EXPANSION.md and the corrections in sources/ — including a paper
      # erratum we assert against.
      - name: Validate against published results
        run: make validate

  # A second compiler, for the class of defect one compiler cannot see.
  #
  # PR #1 arrived because GCC 16 rejects a variable that is only ever
  # incremented, and this project builds with -Werror. GCC 13/14 on
  # ubuntu-latest does not diagnose that, so CI was green while a future
  # compiler was already broken. clang flags the same pattern today
  # (-Wunused-but-set-variable), which makes it a usable early warning
  # without waiting for GCC 16 to reach the runners.
  #
  # Adding it found ten files with no trailing newline and a main() with no
  # prototype -- all latent -Werror failures on a stricter compiler.
  build-test-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with clang -Werror
        run: make all CC=clang

      - name: Run the suites built by clang
        run: make run-tests CC=clang

      - name: Validate against published results
        run: make validate CC=clang
